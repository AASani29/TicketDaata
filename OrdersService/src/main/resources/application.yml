server:
  port: 9002

spring:
  application:
    name: TICKETDAATA-ORDERS-SERVICE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ticketdaata_orders}
      database: ${MONGODB_DATABASE:ticketdaata_orders}
      auto-index-creation: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration
  # Messaging Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: /
    connection-timeout: 10000
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        acknowledge-mode: auto
        prefetch: 10

# Messaging Mode Configuration
messaging:
  mode: rabbitmq # Options: inmemory, rabbitmq

# Order Configuration
orders:
  reservation:
    ttl-minutes: 15 # Time to live for temporary reservations
    cleanup-interval-minutes: 5 # How often to check for expired orders

services:
  ticket:
    url: ${TICKET_SERVICE_URL:http://localhost:8082}

feign:
  client:
    config:
      TICKETDAATA-TICKET-SERVICE:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.ticketdaata.ordersservice: INFO
    org.springframework.data.mongodb: INFO
    com.mongodb: INFO
    org.springframework.boot.autoconfigure.mongo: INFO
