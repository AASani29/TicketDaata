server:
  port: ${TICKET_SERVICE_PORT:8082}

spring:
  application:
    name: TICKETDAATA-TICKET-SERVICE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ticketdaata_tickets}
      database: ${MONGODB_DATABASE:ticketdaata_tickets}
      auto-index-creation: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  # Messaging Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    virtual-host: /
    connection-timeout: 10000
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        acknowledge-mode: auto
        prefetch: 10

# Messaging Mode Configuration
messaging:
  mode: rabbitmq # Options: inmemory, rabbitmq

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

logging:
  level:
    com.ticketdaata.ticketservice: INFO
    org.springframework.data.mongodb: INFO
    com.mongodb: INFO
    org.springframework.boot.autoconfigure.mongo: INFO
