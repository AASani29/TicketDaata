server:
  port: 9003

spring:
  application:
    name: TICKETDAATA-API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: TICKETDAATA-AUTH-SERVICE
          uri: ${AUTH_SERVICE_URL:http://localhost:9001}
          predicates:
            - Path=/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/auth
        - id: TICKETDAATA-ORDERS-SERVICE
          uri: ${ORDERS_SERVICE_URL:http://localhost:9002}
          predicates:
            - Path=/api/orders,/api/orders/**
          filters:
            - RewritePath=/api/orders(?<segment>.*), /orders${segment}
            - name: CircuitBreaker
              args:
                name: ordersCircuitBreaker
                fallbackUri: forward:/fallback/orders
        - id: TICKETDAATA-TICKET-SERVICE
          uri: ${TICKET_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/tickets,/api/tickets/**
          filters:
            - RewritePath=/api/tickets(?<segment>.*), /tickets${segment}
            - name: CircuitBreaker
              args:
                name: ticketCircuitBreaker
                fallbackUri: forward:/fallback/tickets
      default-filters:
        - name: Retry
          args:
            retries: 3
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
            methods: GET,POST,PUT,DELETE

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
