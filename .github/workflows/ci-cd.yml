name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test & build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            dir: APIGateway
          - name: auth-service
            dir: AuthService
          - name: orders-service
            dir: OrdersService
          - name: ticket-service
            dir: ticketservice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.dir }}/pom.xml

      - name: Make mvnw executable
        working-directory: ${{ matrix.dir }}
        run: chmod +x ./mvnw

      - name: Build and test
        working-directory: ${{ matrix.dir }}
        run: ./mvnw -B -ntp test

  frontend:
    name: Frontend (lint & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  k8s-validate:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: kustomize build (dry render, no cluster)
        run: kubectl kustomize k8s/ > /dev/null

  docker-publish:
    name: Build & push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [test-build, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-gateway
            context: APIGateway
            dockerfile: APIGateway/Dockerfile
          - name: auth-service
            context: AuthService
            dockerfile: AuthService/Dockerfile
          - name: orders-service
            context: OrdersService
            dockerfile: OrdersService/Dockerfile
          - name: ticket-service
            context: ticketservice
            dockerfile: ticketservice/Dockerfile
          - name: frontend
            context: Frontend
            dockerfile: Frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Compute image metadata
        id: vars
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/ticketdaata-${{ matrix.name }}:latest
            ghcr.io/${{ steps.vars.outputs.owner }}/ticketdaata-${{ matrix.name }}:${{ steps.vars.outputs.sha_short }}
