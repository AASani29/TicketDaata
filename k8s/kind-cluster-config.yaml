# Local kind cluster with host ports 80/443 bound to the control-plane node,
# which is what lets ingress-nginx be reached at http://localhost/ without a cloud LB.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
